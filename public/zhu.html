<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人井字棋游戏</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <div class="container">
        <h1>多人井字棋游戏</h1>

        <div id="main-menu">
            <button id="create-room-btn">创建房间</button>
            <button id="scan-rooms-btn">扫描房间</button>
        </div>

        <div id="room-input" class="hidden">
            <input type="text" id="room-id" placeholder="输入房间号">
            <button id="join-room-btn">加入房间</button>
            <button id="back-btn">返回</button>
        </div>

        <div id="room-list" class="hidden">
            <h2>可用房间</h2>
            <div id="rooms-container"></div>
            <button id="back-to-menu">返回</button>
        </div>

        <div id="game-container" class="hidden">
            <div id="status">等待对手...</div>
            <div class="game-board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="restart-button" class="hidden">重新开始</button>
            <button id="close-room-btn" class="hidden">关闭房间</button>
            <div id="result"></div>
        </div>

        <button id="exit-room-btn" class="hidden">退出房间</button>

        <div id="waiting-message" class="hidden">
            <p>等待对手加入...</p>
        </div>

        <div id="opponent-disconnected" class="hidden">
            <p>对手已断开连接</p>
            <button id="find-new-opponent">寻找新对手</button>
        </div>
        <div id="toast" class="hidden"></div>
    </div>

    <script>
    (function(){
        function loadApp(){
            var s = document.createElement('script');
            s.src = '1.js';
            document.body.appendChild(s);
        }

        function loadCDN(){
            var cdn = document.createElement('script');
            cdn.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
            cdn.onload = loadApp;
            document.head.appendChild(cdn);
        }

        var local = document.createElement('script');
        local.src = './socket.io.min.js';
        local.onload = loadApp;
        local.onerror = loadCDN;
        document.head.appendChild(local);
    })();
    </script>
</body>
</html>
